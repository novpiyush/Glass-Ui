<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:url("background.jpg");
background-size:cover;
background-position:center;

font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}


.card{

width:80vw;
max-width:320px;

padding:14px;

border-radius:25px;

background:rgba(255,255,255,0.12);

backdrop-filter:blur(40px);

border:1px solid rgba(255,255,255,0.35);

box-shadow:0 30px 70px rgba(0,0,0,0.7);

}


.photo{

width:100%;
height:220px;

border-radius:15px;

object-fit:contain;

background:black;

margin-bottom:14px;

}


.text{

border-radius:15px;

padding:18px;

background:rgba(255,255,255,0.10);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,0.25);

text-align:center;

}


.line1{

font-size:18px;
font-weight:700;
color:white;

}


.line2{

font-size:14px;
color:white;

}


button{

margin-top:20px;

padding:12px 25px;

border-radius:10px;

border:none;

font-size:16px;

}


</style>

</head>

<body>


<div class="card">

<img src="reel.png" class="photo">

<div class="text">

<div class="line1">
2000 Family Members Complete
</div>

<div class="line2">
Thank You For Being Part Of This Journey
</div>

</div>

</div>



<button onclick="download4K()">
Download 4K 9:16
</button>



<script>

function download4K(){

let canvas=document.createElement("canvas");
let ctx=canvas.getContext("2d");

canvas.width=2160;
canvas.height=3840;


/* Background */

let bg=new Image();
bg.src="background.jpg";

bg.onload=function(){

ctx.drawImage(bg,0,0,2160,3840);


/* Glass Card */

ctx.fillStyle="rgba(255,255,255,0.12)";
ctx.fillRect(330,900,1500,1800);


/* Reel Photo */

let img=new Image();
img.src="reel.png";

img.onload=function(){

ctx.drawImage(img,400,1000,1360,900);


/* Text */

ctx.fillStyle="white";
ctx.textAlign="center";

ctx.font="bold 80px sans-serif";

ctx.fillText("2000 Family Members Complete",1080,2300);

ctx.font="50px sans-serif";

ctx.fillText("Thank You For Being Part Of This Journey",1080,2400);


/* Download */

let link=document.createElement("a");

link.download="Reel4K.png";

link.href=canvas.toDataURL();

link.click();

}

}

}

</script>


</body>
</html>
