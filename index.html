<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

body{
margin:0;
height:100vh;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:url("background.jpg");
background-size:cover;
background-position:center;

font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}


/* Glass UI */

#export{

width:300px;

padding:16px;

border-radius:26px;

background:rgba(255,255,255,0.12);

backdrop-filter:blur(40px);

border:1px solid rgba(255,255,255,0.35);

box-shadow:0 30px 70px rgba(0,0,0,0.7);

margin:40px;

}


/* Photo */

.photo{

width:100%;

border-radius:18px;

display:block;

object-fit:cover;

}


/* Text */

.text{

margin-top:16px;

border-radius:18px;

padding:18px;

background:rgba(255,255,255,0.15);

border:1px solid rgba(255,255,255,0.25);

text-align:center;

}


.line1{

font-size:20px;
font-weight:700;
color:white;

}


.line2{

font-size:14px;
color:white;
margin-top:5px;

}


/* Button */

button{

margin-top:20px;

padding:14px 30px;

border-radius:12px;

border:none;

font-size:16px;

cursor:pointer;

}

</style>

</head>



<body>



<div id="export">

<img src="reel.png" class="photo">

<div class="text">

<div class="line1">
2000 Family Members Complete
</div>

<div class="line2">
Thank You For Being Part Of This Journey
</div>

</div>

</div>



<button onclick="download4K()">
Download 4K 9:16
</button>



<script>

function download4K(){

html2canvas(document.getElementById("export"),{

scale:8,
useCORS:true

}).then(canvas=>{

let link=document.createElement("a");

link.download="Reel.png";

link.href=canvas.toDataURL("image/png");

link.click();

});

}

</script>



</body>
</html>
