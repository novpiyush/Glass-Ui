<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

body{
margin:0;
background:black;
display:flex;
flex-direction:column;
align-items:center;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}


/* EXACT REEL FRAME */

#frame{

width:360px;
height:640px;

position:relative;
overflow:hidden;

margin-top:20px;

}


/* Background */

.bg{

position:absolute;
width:100%;
height:100%;

object-fit:cover;

}


/* Glass UI */

.card{

position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

width:300px;

padding:16px;

border-radius:26px;

background:rgba(255,255,255,0.12);

backdrop-filter:blur(40px);

border:1px solid rgba(255,255,255,0.35);

box-shadow:0 30px 70px rgba(0,0,0,0.7);

}


/* Reel Photo */

.photo{

width:100%;

border-radius:18px;

display:block;

}


/* Text */

.text{

margin-top:15px;

padding:18px;

border-radius:18px;

background:rgba(255,255,255,0.15);

border:1px solid rgba(255,255,255,0.25);

text-align:center;

}


.line1{

font-size:18px;
font-weight:700;
color:white;

}


.line2{

font-size:14px;
color:white;

margin-top:5px;

}


/* Button */

button{

margin:20px;

padding:14px 25px;

border-radius:12px;

border:none;

font-size:16px;

}

</style>

</head>


<body>



<div id="frame">

<img src="background.jpg" class="bg">

<div class="card">

<img src="reel.png" class="photo">

<div class="text">

<div class="line1">

2000 Family Members Complete

</div>

<div class="line2">

Thank You For Being Part Of This Journey

</div>

</div>

</div>

</div>



<button onclick="download4K()">

Download 4K 9:16

</button>



<script>

function download4K(){

html2canvas(document.getElementById("frame"),{

scale:6,
useCORS:true

}).then(canvas=>{

let link=document.createElement("a");

link.download="Reel.png";

link.href=canvas.toDataURL("image/png");

link.click();

});

}

</script>



</body>
</html>
