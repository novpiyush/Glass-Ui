<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

background:url("background.jpg");
background-size:cover;
background-position:center;

font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}


/* Main Export Area */

#export{

width:90vw;
max-width:360px;

padding:15px;

border-radius:25px;

background:rgba(255,255,255,0.12);

backdrop-filter:blur(40px);

border:1px solid rgba(255,255,255,0.35);

box-shadow:0 30px 70px rgba(0,0,0,0.7);

}


/* Reel Photo */

.photo{

width:100%;
border-radius:20px;

object-fit:cover;

}


/* Text */

.text{

margin-top:15px;

border-radius:20px;

padding:20px;

background:rgba(255,255,255,0.15);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,0.25);

text-align:center;

}


.line1{

font-size:20px;
font-weight:700;
color:white;

}


.line2{

font-size:14px;
color:white;

margin-top:5px;

}



button{

margin-top:20px;

padding:14px 30px;

border-radius:12px;

border:none;

font-size:16px;

}


</style>

</head>

<body>



<div id="export">

<img src="reel.png" class="photo">

<div class="text">

<div class="line1">
2000 Family Members Complete
</div>

<div class="line2">
Thank You For Being Part Of This Journey
</div>

</div>

</div>



<button onclick="download4K()">
Download 4K 9:16
</button>



<script>

function download4K(){

html2canvas(document.getElementById("export"),{

scale:4

}).then(canvas=>{

let link=document.createElement("a");

link.download="4K_Reel.png";

link.href=canvas.toDataURL();

link.click();

});

}

</script>

</body>
</html>
